<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro de Pruebas · Clan Scout</title>
<style>
:root{--p:#5f2c91;--pl:#efe8f7;--b:#ddd;--bg:#f6f4f9}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:#222}
h2{margin:0 0 14px;color:var(--p)}h3{margin:0 0 10px;font-size:16px}
input,select,textarea,button{font:inherit;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:#fff;max-width:100%}
textarea{width:100%;min-height:54px}label{display:block;font-size:13px;color:#555;margin-bottom:8px}label input,label select{display:block;width:100%;margin-top:3px;color:#222;font-size:15px}
button{cursor:pointer;background:var(--p);color:#fff;border:0;font-weight:600}button.sec{background:#fff;color:var(--p);border:1px solid var(--p)}button:disabled{opacity:.5}
#login{max-width:340px;margin:12vh auto;background:#fff;padding:28px;border-radius:14px;text-align:center;box-shadow:0 4px 18px #0002}
#login img,aside img{width:84px}#le{color:#b00;min-height:20px}
#app{display:flex;min-height:100vh}aside{width:210px;background:var(--p);color:#fff;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
aside img{align-self:center;background:#fff;border-radius:50%;margin-bottom:8px}aside button{background:transparent;text-align:left;border:1px solid transparent;color:#fff}
aside button.on{background:#fff3;border-color:#fff8}aside .sp{flex:1}main{flex:1;padding:22px;max-width:980px}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;background:#888}.tag.basica{background:#2e7d32}.tag.opcional{background:#ef6c00}
details{border:1px solid var(--b);border-radius:8px;padding:8px 10px;margin:8px 0}summary{cursor:pointer;font-weight:600}
.ck{display:flex;gap:8px;align-items:flex-start;color:#222;font-size:14px}.ck input{width:auto;margin:3px 0 0}
.ln{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}.ln input,.ln textarea{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}
.ok{color:#2e7d32}.er{color:#b00}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pt{margin:6px 0}small{color:#666}
@media(max-width:800px){#app{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center}aside img{width:44px;margin:0}aside .sp{display:none}main{padding:12px}}
</style></head><body>

const db=supabase.createClient(SB_URL,SB_KEY);
const $=(s,e=document)=>e.querySelector(s),main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?d.split('-').reverse().join('/'):'';
const AREAS={1:{n:'Servicio Social y Comunidad',b:{1:'Religión',2:'Familia',3:'Comunidad',4:'Escuela o Trabajo',5:'Identidad Nacional'}},
2:{n:'Vivencia al Aire Libre',b:{1:'Campismo',2:'Pionerismo',3:'Especialidades (actividades)',4:'Exploración',5:'Ley y Promesa',6:'Conservacionismo'}},
3:{n:'Desarrollo Personal',b:{1:'Corporal',2:'Cultural',3:'Ocupacional',4:'Social',5:'Espiritual',6:'Liderazgo'}}};
let D={};
const say=(el,t,ok)=>{el.innerHTML=`<span class="${ok?'ok':'er'}">${esc(t)}</span>`};
async function load(){
 const r=await Promise.all([db.from('etapas_rover').select().order('orden'),db.from('areas_indicadores').select().order('orden'),db.from('etapas_indicadores').select().order('orden'),db.from('indicadores').select().order('orden').range(0,4999),db.from('pruebas').select().order('codigo').range(0,999)]);
 const e=r.find(x=>x.error);if(e)throw e.error;
 [D.etR,D.areas,D.etI,D.ind,D.pruebas]=r.map(x=>x.data);
 const m=(a,k='id')=>Object.fromEntries(a.map(x=>[x[k],x]));
 D.etRM=m(D.etR);D.areaM=m(D.areas);D.etIM=m(D.etI);D.iM=m(D.ind);D.pM=m(D.pruebas,'codigo');
}
async function start(){
 try{await load()}catch(e){$('#le').textContent='Error cargando datos: '+e.message;return}
 $('#login').hidden=true;$('#app').hidden=false;nav('reg');
}
$('#lf').onsubmit=async e=>{e.preventDefault();const u=$('#u').value.trim();
 const {error}=await db.auth.signInWithPassword({email:u.includes('@')?u:u.toLowerCase()+'@scouts.app',password:$('#p').value});
 if(error)$('#le').textContent='Usuario o clave incorrectos';else start();};
$('#out').onclick=async()=>{await db.auth.signOut();location.reload()};
document.querySelectorAll('aside [data-v]').forEach(b=>b.onclick=()=>nav(b.dataset.v));
function nav(v){document.querySelectorAll('aside [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==v));({reg:viewReg,con:viewCon,cfg:viewCfg})[v]()}

/* ---------- REGISTRO ---------- */
function viewReg(){
 main.innerHTML=`<h2>Registro de pruebas</h2><div class="card"><h3>Datos del joven</h3><div class="g">
 <label>Cédula<input id="ced" inputmode="numeric"></label><label>Nombre y apellido<input id="nom"></label>
 <label>Etapa que cursa<select id="etp">${D.etR.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join('')}</select></label>
 <label>Fecha de la asamblea<input id="fec" type="date"></label></div></div>
 <div id="rows"></div><div class="bar"><button class="sec" id="add">+ Agregar prueba</button><button id="save">Guardar registro</button></div><div id="msg"></div>`;
 $('#fec').value=new Date().toISOString().slice(0,10);
 $('#ced').onchange=async()=>{const c=$('#ced').value.replace(/\D/g,'');$('#ced').value=c;if(!c)return;
  const {data}=await db.from('jovenes').select().eq('cedula',c).maybeSingle();if(data){$('#nom').value=data.nombre;if(data.etapa_id)$('#etp').value=data.etapa_id}};
 $('#add').onclick=addRow;$('#save').onclick=save;addRow();
}
function addRow(){
 const r=document.createElement('div');r.className='card row';r._sel=new Set();r._code='';
 const ie=`<option value="">Elegir…</option>`+D.etI.map(e=>`<option value="${e.id}">${esc(e.nombre)}</option>`).join('');
 r.innerHTML=`<div class="g3"><label>Área<select class="pa"><option value="">Elegir…</option>${[1,2,3].map(a=>`<option value="${a}">${AREAS[a].n}</option>`).join('')}</select></label>
 <label>Bloque<select class="pb" disabled></select></label><label>Prueba<select class="pp" disabled></select></label></div><div class="pt"></div>
 <details><summary>Indicadores demostrados <small class="tot"></small></summary>${D.areas.map(a=>`<details data-a="${a.id}"><summary>${esc(a.nombre)} <small class="cnt"></small></summary>
 <label>Etapa del indicador<select class="ie">${ie}</select></label><div class="ch"></div></details>`).join('')}</details>
 <button type="button" class="sec del">Quitar prueba</button>`;
 r.querySelector('.del').onclick=()=>r.remove();
 r.onchange=e=>{const t=e.target,pb=$('.pb',r),pp=$('.pp',r);
  if(t.classList.contains('pa')){pb.innerHTML=`<option value="">Elegir…</option>`+Object.entries(AREAS[t.value]?.b||{}).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');pb.disabled=!t.value;pp.innerHTML='';pp.disabled=true;r._code='';$('.pt',r).innerHTML=''}
  else if(t.classList.contains('pb')){const l=D.pruebas.filter(p=>p.area==$('.pa',r).value&&p.bloque==t.value);
   pp.innerHTML=`<option value="">Elegir…</option>`+l.map(p=>`<option value="${p.codigo}">${p.codigo} · ${esc(p.texto.slice(0,70))}</option>`).join('');pp.disabled=false;r._code='';$('.pt',r).innerHTML=''}
  else if(t.classList.contains('pp')){const p=D.pM[t.value];r._code=t.value;$('.pt',r).innerHTML=p?`<span class="tag ${p.tipo}">${p.tipo=='basica'?'Básica':'Opcional'}</span> ${esc(p.texto)}`:''}
  else if(t.classList.contains('ie')){drawCh(r,t.closest('[data-a]'))}
  else if(t.type=='checkbox'){const id=+t.value;t.checked?r._sel.add(id):r._sel.delete(id);cnt(r)}};
 $('#rows').appendChild(r);
}
function drawCh(r,det){const a=+det.dataset.a,e=+$('.ie',det).value;
 $('.ch',det).innerHTML=D.ind.filter(i=>i.area_id==a&&i.etapa_id==e).map(i=>`<label class="ck"><input type="checkbox" value="${i.id}" ${r._sel.has(i.id)?'checked':''}> ${esc(i.texto)}</label>`).join('')||'<em>Sin indicadores</em>'}
function cnt(r){r.querySelectorAll('[data-a]').forEach(d=>{const n=[...r._sel].filter(i=>D.iM[i]?.area_id==d.dataset.a).length;$('.cnt',d).textContent=n?`(${n} marcados)`:''});$('.tot',r).textContent=r._sel.size?`· ${r._sel.size} marcados`:''}
async function save(){
 const m=$('#msg'),btn=$('#save');const ced=$('#ced').value.replace(/\D/g,''),nom=$('#nom').value.trim(),fec=$('#fec').value,etp=+$('#etp').value;
 let rows=[...document.querySelectorAll('.row')].map(r=>({codigo:r._code,sel:[...r._sel]}));
 if(!ced||!nom||!fec)return say(m,'Completa cédula, nombre y fecha.');
 if(!rows.length||rows.some(r=>!r.codigo))return say(m,'Cada fila debe tener una prueba elegida.');
 const cs=rows.map(r=>r.codigo);if(new Set(cs).size<cs.length)return say(m,'Hay una prueba repetida en este formulario.');
 btn.disabled=true;try{
  const {data:du,error:e0}=await db.from('registro_pruebas').select('codigo,registros!inner(cedula,fecha_asamblea)').eq('registros.cedula',ced).in('codigo',cs);if(e0)throw e0;
  const skipped=[];for(const d of du){if(!confirm(`${nom} (C.I. ${ced}) ya tiene la prueba ${d.codigo} registrada el ${fmt(d.registros.fecha_asamblea)}.\n\n¿Desea guardar de todos modos?`)){skipped.push(d.codigo)}}
  rows=rows.filter(r=>!skipped.includes(r.codigo));if(!rows.length){btn.disabled=false;return say(m,'No se guardó nada.')}
  let x=await db.from('jovenes').upsert({cedula:ced,nombre:nom,etapa_id:etp});if(x.error)throw x.error;
  x=await db.from('registros').insert({cedula:ced,nombre:nom,etapa_id:etp,fecha_asamblea:fec}).select().single();if(x.error)throw x.error;const reg=x.data;
  x=await db.from('registro_pruebas').insert(rows.map(r=>({registro_id:reg.id,codigo:r.codigo,tipo:D.pM[r.codigo].tipo}))).select();if(x.error)throw x.error;
  const link=rows.flatMap(r=>{const rp=x.data.find(q=>q.codigo==r.codigo);return r.sel.map(i=>({registro_prueba_id:rp.id,indicador_id:i}))});
  if(link.length){const y=await db.from('registro_indicadores').insert(link);if(y.error)throw y.error}
  m.innerHTML=`<span class="ok">Registro guardado${skipped.length?` (omitidas: ${skipped.join(', ')})`:''}.</span> <button id="dl">Descargar PDF</button> <button class="sec" id="nw">Nuevo registro</button>`;
  $('#dl').onclick=()=>pdfById(reg.id);$('#nw').onclick=viewReg;pdfById(reg.id);
 }catch(e){say(m,'Error: '+e.message)}btn.disabled=false;
}

/* ---------- PDF ---------- */
async function pdfById(id){const {data,error}=await db.from('registros').select('*,registro_pruebas(codigo,tipo,registro_indicadores(indicador_id))').eq('id',id).single();if(error)return alert(error.message);makePdf(data)}
function makePdf(reg){
 const doc=new jspdf.jsPDF(),M=15,W=180;let y=46;const need=h=>{if(y+h>280){doc.addPage();y=20}};
 doc.addImage(LOGO,'PNG',M,9,24,24);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text('Registro de Pruebas · Adelanto Progresivo',M+30,19);
 doc.setFontSize(10);doc.setFont('helvetica','normal');doc.text('Clan Scout · Asociación de Scouts de Venezuela',M+30,26);doc.setDrawColor(95,44,145);doc.line(M,37,195,37);
 const kv=(k,v)=>{doc.setFont('helvetica','bold');doc.text(k+':',M,y);doc.setFont('helvetica','normal');doc.text(String(v||''),M+40,y);y+=7};
 kv('Nombre y apellido',reg.nombre);kv('Cédula',reg.cedula);kv('Etapa que cursa',D.etRM[reg.etapa_id]?.nombre);kv('Fecha de asamblea',fmt(reg.fecha_asamblea));y+=4;
 reg.registro_pruebas.sort((a,b)=>a.codigo<b.codigo?-1:1).forEach((rp,i)=>{const p=D.pM[rp.codigo]||{};
  need(26);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(95,44,145);doc.text(`${i+1}. Prueba ${rp.codigo} · ${rp.tipo=='basica'?'Básica':'Opcional'}`,M,y);y+=6;
  doc.setTextColor(0);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.splitTextToSize(p.texto||'',W).forEach(l=>{need(6);doc.text(l,M,y);y+=5});
  const its=rp.registro_indicadores.map(q=>D.iM[q.indicador_id]).filter(Boolean).sort((a,b)=>a.area_id-b.area_id||a.etapa_id-b.etapa_id||a.orden-b.orden);
  y+=1;need(7);doc.setFont('helvetica','bold');doc.text('Indicadores demostrados:',M,y);y+=5;doc.setFont('helvetica','normal');
  if(!its.length){doc.setFont('helvetica','italic');doc.text('Ninguno marcado.',M+2,y);y+=5}
  let g='';its.forEach(t=>{const k=t.area_id+'-'+t.etapa_id;if(k!=g){g=k;need(7);doc.setFont('helvetica','italic');doc.setFontSize(9);doc.text(`${D.areaM[t.area_id]?.nombre} · ${D.etIM[t.etapa_id]?.nombre} etapa`,M+2,y);y+=5;doc.setFont('helvetica','normal')}
   doc.setFontSize(9.5);doc.splitTextToSize('• '+t.texto,W-8).forEach(l=>{need(5);doc.text(l,M+6,y);y+=4.6})});
  doc.setFontSize(10);y+=5});
 need(45);y+=22;doc.line(M,y,M+70,y);doc.line(125,y,195,y);doc.text('Scouter / Dirigente',M+12,y+5);doc.text('Joven',150,y+5);
 const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.text(`Página ${i} de ${n}`,105,290,{align:'center'})}
 doc.save(`Pruebas_${reg.cedula}_${reg.fecha_asamblea}.pdf`);
}

/* ---------- CONSULTAS ---------- */
function viewCon(){
 main.innerHTML=`<h2>Consultas</h2><div class="card"><div class="g"><label>Nombre<input id="fn"></label><label>Cédula<input id="fc" inputmode="numeric"></label>
 <label>Desde<input id="fd" type="date"></label><label>Hasta<input id="fh" type="date"></label><label>N° de prueba<input id="fp" placeholder="ej. 112"></label></div>
 <div class="bar"><button id="bs">Buscar</button><button class="sec" id="bx">Exportar todo a CSV</button></div></div><div id="res"></div>`;
 $('#bs').onclick=buscar;$('#bx').onclick=exportar;buscar();
}
function qReg(f={}){let q=db.from('registros').select('*,registro_pruebas'+(f.p?'!inner':'')+'(codigo,tipo,registro_indicadores(indicador_id))').order('fecha_asamblea',{ascending:false}).order('id',{ascending:false}).range(0,4999);
 if(f.n)q=q.ilike('nombre','%'+f.n+'%');if(f.c)q=q.like('cedula',f.c+'%');if(f.d)q=q.gte('fecha_asamblea',f.d);if(f.h)q=q.lte('fecha_asamblea',f.h);if(f.p)q=q.eq('registro_pruebas.codigo',f.p);return q}
async function buscar(){const f={n:$('#fn').value.trim(),c:$('#fc').value.replace(/\D/g,''),d:$('#fd').value,h:$('#fh').value,p:$('#fp').value.trim()};
 const {data,error}=await qReg(f);if(error)return say($('#res'),error.message);
 $('#res').innerHTML=`<div class="card"><small>${data.length} registro(s)</small><div style="overflow-x:auto"><table><tr><th>Fecha</th><th>Joven</th><th>Cédula</th><th>Etapa</th><th>Pruebas</th><th></th></tr>`+
 data.map(r=>`<tr><td>${fmt(r.fecha_asamblea)}</td><td>${esc(r.nombre)}</td><td>${r.cedula}</td><td>${esc(D.etRM[r.etapa_id]?.nombre)}</td><td>${r.registro_pruebas.map(p=>p.codigo).join(', ')}</td><td><button data-id="${r.id}">PDF</button></td></tr>`).join('')+`</table></div></div>`;
 document.querySelectorAll('#res [data-id]').forEach(b=>b.onclick=()=>pdfById(b.dataset.id))}
async function exportar(){const {data,error}=await qReg();if(error)return alert(error.message);
 const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"',L=[['Fecha asamblea','Cédula','Nombre','Etapa','Prueba','Tipo','Texto de la prueba','Indicadores'].map(c).join(',')];
 data.forEach(r=>r.registro_pruebas.forEach(p=>L.push([fmt(r.fecha_asamblea),r.cedula,r.nombre,D.etRM[r.etapa_id]?.nombre,p.codigo,p.tipo,D.pM[p.codigo]?.texto,p.registro_indicadores.map(i=>D.iM[i.indicador_id]?.texto).join(' | ')].map(c).join(','))));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'}));a.download='respaldo_pruebas_'+new Date().toISOString().slice(0,10)+'.csv';a.click()}

/* ---------- CONFIGURACIÓN ---------- */
function listEd(tbl,arr,box,ph){
 box.innerHTML=arr.map(x=>`<div class="ln"><input value="${esc(x.nombre)}" data-id="${x.id}"><button class="sv">Guardar</button></div>`).join('')+`<div class="ln"><input class="nw" placeholder="${ph}"><button class="ad">Agregar</button></div><div class="mm"></div>`;
 const mm=$('.mm',box),done=async(e,t)=>{if(e)return say(mm,e.message);await load();listEd(tbl,tbl=='etapas_rover'?D.etR:D.etI,box,ph);say($('.mm',box),t,1)};
 box.querySelectorAll('.sv').forEach(b=>b.onclick=async()=>{const i=b.previousElementSibling;done((await db.from(tbl).update({nombre:i.value.trim()}).eq('id',i.dataset.id)).error,'Guardado')});
 $('.ad',box).onclick=async()=>{const v=$('.nw',box).value.trim();if(v)done((await db.from(tbl).insert({nombre:v,orden:arr.length+1})).error,'Agregado')};
}
function viewCfg(){
 main.innerHTML=`<h2>Configuración</h2><div class="card"><h3>Etapas del joven</h3><div id="c1"></div></div><div class="card"><h3>Etapas de los indicadores</h3><div id="c2"></div></div>
 <div class="card"><h3>Indicadores</h3><div class="g"><label>Área<select id="xa">${D.areas.map(a=>`<option value="${a.id}">${esc(a.nombre)}</option>`).join('')}</select></label>
 <label>Etapa<select id="xe">${D.etI.map(e=>`<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}</select></label></div><div id="xl"></div></div>`;
 listEd('etapas_rover',D.etR,$('#c1'),'Nueva etapa…');listEd('etapas_indicadores',D.etI,$('#c2'),'Nueva etapa de indicadores…');
 $('#xa').onchange=$('#xe').onchange=drawInd;drawInd();
}
function drawInd(){const a=+$('#xa').value,e=+$('#xe').value,box=$('#xl');
 box.innerHTML=D.ind.filter(i=>i.area_id==a&&i.etapa_id==e).map(i=>`<div class="ln"><textarea data-id="${i.id}">${esc(i.texto)}</textarea><button class="sv">Guardar</button><button class="sec dl">Eliminar</button></div>`).join('')+
 `<div class="ln"><textarea class="nw" placeholder="Nuevo indicador…"></textarea><button class="ad">Agregar</button></div><div class="mm"></div>`;
 const mm=$('.mm',box),done=async(er,t)=>{if(er)return say(mm,er.message.includes('foreign')?'No se puede eliminar: ya fue usado en un registro.':er.message);await load();drawInd();say($('.mm',box),t,1)};
 box.querySelectorAll('.sv').forEach(b=>b.onclick=async()=>done((await db.from('indicadores').update({texto:b.previousElementSibling.value.trim()}).eq('id',b.previousElementSibling.dataset.id)).error,'Guardado'));
 box.querySelectorAll('.dl').forEach(b=>b.onclick=async()=>{if(confirm('¿Eliminar este indicador?'))done((await db.from('indicadores').delete().eq('id',b.parentNode.firstChild.dataset.id)).error,'Eliminado')});
 $('.ad',box).onclick=async()=>{const v=$('.nw',box).value.trim();if(v)done((await db.from('indicadores').insert({area_id:a,etapa_id:e,texto:v,orden:99})).error,'Agregado')};
}
db.auth.getSession().then(({data})=>{if(data.session)start()});
</script></body></html>
